<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inscription · Master Lab</title>
<link rel="icon" href="assets/favicon.svg">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="inscription">
<main class="band">
  <div class="wrap form" style="padding-block:56px">
    <form class="card col" id="form" style="padding:30px">
      <h1 style="font-size:32px">Créer un compte</h1>
      <p>Gratuit. La recherche, la carte et le quiz restent accessibles sans compte.</p>
      <div class="grid" style="--c:2;--cm:2;gap:12px">
        <div><label for="prenom">Prénom</label><input type="text" id="prenom" required autocomplete="given-name"></div>
        <div><label for="nom">Nom</label><input type="text" id="nom" required autocomplete="family-name"></div>
      </div>
      <div><label for="email">E-mail</label><input type="email" id="email" required autocomplete="email"></div>
      <div><label for="mdp">Mot de passe <span class="muted">(8 caractères minimum)</span></label><input type="password" id="mdp" required minlength="8" autocomplete="new-password"></div>
      <div><label for="formation">Formation d’origine</label>
        <select id="formation" required>
          <option value="">Choisir…</option>
          <option>BUT MMI</option><option>BUT (autre spécialité)</option><option>Licence arts</option>
          <option>Licence information-communication</option><option>Licence informatique</option><option>Autre</option>
        </select></div>
      <label class="check"><input type="checkbox" required> J’accepte les conditions d’utilisation</label>
      <button class="btn p full">Créer mon compte</button>
      <p style="text-align:center"><span class="muted">Déjà un compte ?</span> <a href="connexion.html" id="login">Se connecter</a></p>
      <p class="muted">Prototype sans serveur : les informations restent dans ce navigateur, le mot de passe n’est pas enregistré.</p>
    </form>
  </div>
</main>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
  const next = /^[\w-]+\.html([?#].*)?$/.test(params.get('next') || '') ? params.get('next') : 'espace.html';
  $('#login').href = 'connexion.html?next=' + encodeURIComponent(next);
  $('#form').addEventListener('submit', (e) => {
    e.preventDefault();
    store.set('user', { prenom: $('#prenom').value.trim(), nom: $('#nom').value.trim(), email: $('#email').value.trim(), formation: $('#formation').value });
    store.set('logged', true);
    location.href = next;
  });
</script>
</body>
</html>
