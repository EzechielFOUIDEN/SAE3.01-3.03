<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Connexion · Master Lab</title>
<link rel="icon" href="assets/favicon.svg">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="connexion">
<main class="band">
  <div class="wrap form" style="padding-block:56px">
    <form class="card col" id="form" style="padding:30px">
      <h1 style="font-size:32px">Connexion</h1>
      <p>Retrouve tes favoris et ta sélection de comparaison.</p>
      <div><label for="email">E-mail</label><input type="email" id="email" required autocomplete="email"></div>
      <div><label for="mdp">Mot de passe</label><input type="password" id="mdp" required autocomplete="current-password"></div>
      <a href="#" id="forgot">Mot de passe oublié ?</a>
      <p class="error" id="err" hidden></p>
      <button class="btn p full">Se connecter</button>
      <p style="text-align:center"><span class="muted">Pas encore de compte ?</span> <a href="inscription.html" id="signup">Créer un compte</a></p>
      <p class="muted">Prototype sans serveur : le compte reste dans ce navigateur et le mot de passe n’est ni stocké ni vérifié.</p>
    </form>
  </div>
</main>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
  // Retour vers la page d'origine : seulement une page du site (pas d'adresse extérieure).
  const next = /^[\w-]+\.html([?#].*)?$/.test(params.get('next') || '') ? params.get('next') : 'espace.html';
  $('#signup').href = 'inscription.html?next=' + encodeURIComponent(next);
  $('#forgot').addEventListener('click', (e) => { e.preventDefault(); toast('Prototype : un lien de réinitialisation serait envoyé par e-mail'); });
  $('#form').addEventListener('submit', (e) => {
    e.preventDefault();
    const saved = store.get('user', null);
    // shortcut: pas de serveur, le mot de passe n'est ni stocké ni vérifié ; vrai back-end à l'industrialisation.
    if (!saved || norm(saved.email) !== norm($('#email').value)) {
      $('#err').hidden = false;
      $('#err').innerHTML = 'Aucun compte avec cet e-mail sur ce navigateur. <a href="' + esc($('#signup').getAttribute('href')) + '">Créer un compte</a>';
      return;
    }
    store.set('logged', true);
    location.href = next;
  });
</script>
</body>
</html>
